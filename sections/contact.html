<section class="contact section" id="contact" aria-labelledby="contact-title">
      <div class="container contact-layout">
        <div class="contact-topline reveal">
          <span>08 / CONTACT</span>
          <span>OPEN FOR SELECT PROJECTS</span>
        </div>

        <div class="contact-main">
          <p class="eyebrow reveal">Have something in mind?</p>

          <h2 id="contact-title" class="contact-title reveal reveal-mask">
            Bring me the<br><em>problem.</em>
          </h2>

          <p class="contact-intro reveal">
            Send me the idea, the problem or even the roughest version of what you have. We can start there.
          </p>

          <a class="contact-link reveal" href="https://instagram.com/mrpapypants" target="_blank" rel="noopener">
            <span>DM @MRPAPYPANTS</span>
            <strong>↗</strong>
          </a>

          <small class="contact-note reveal">INSTAGRAM / DIRECT MESSAGE</small>
          <div class="inquiry-panel reveal">
            <form class="inquiry-form" id="inquiry-form">
              <label>Name<input name="name" type="text" autocomplete="name" required placeholder="Your name"></label>
              <label>Business / project<input name="business" type="text" autocomplete="organization" required placeholder="Business or project name"></label>
              <label>Contact<input name="contact" type="text" autocomplete="email" required placeholder="Email or WhatsApp"></label>
              <label>What do you need?<select name="service" required><option value="">Choose one</option><option>Business website</option><option>Landing page</option><option>Portfolio website</option><option>Redesign</option><option>Something else</option></select></label>
              <label class="inquiry-full">Project brief<textarea name="brief" required placeholder="What are you trying to build, and what should the site accomplish?"></textarea></label>
              <button class="inquiry-submit" type="submit">Prepare inquiry ↗</button>
              <p class="inquiry-status" id="inquiry-status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </div>
    </section>
